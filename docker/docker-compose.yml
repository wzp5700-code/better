services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: /app/data/app.db
      NODE_ENV: production
      # Comma-separated origins allowed to call the API (Caddy URL + Capacitor schemes)
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://localhost}
      # Optional: path to FCM service account JSON (Phase 4)
      # FCM_SERVICE_ACCOUNT_JSON_PATH: /run/secrets/fcm.json
      # Push check interval — Phase 4
      # PUSH_CHECK_INTERVAL_MS: "60000"
    volumes:
      - app-data:/app/data
      # Optional: bind-mount the FCM credentials
      # - ./secrets/fcm.json:/run/secrets/fcm.json:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/habits?status=active"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # Domain that Caddy will request a Let's Encrypt cert for.
      # Leave empty to access via raw IP over plain HTTP (no TLS).
      DOMAIN: ${DOMAIN:-}
    networks:
      - internal
      - default

  backup:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: ["sh", "-c", "while true; do /app/docker/backup.sh; sleep 86400; done"]
    volumes:
      - app-data:/app/data:ro
      - app-backups:/backups
    environment:
      BACKUP_KEEP_DAYS: "30"
    networks:
      - internal

volumes:
  app-data:
  app-backups:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge