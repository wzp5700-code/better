name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 12m
          script: |
            set -euo pipefail

            # Ensure git is installed (Alibaba swas images sometimes lack it)
            if ! command -v git >/dev/null 2>&1; then
              echo "--- installing git ---"
              (apt-get update -qq && apt-get install -y -qq git ca-certificates) || (yum install -y -q git ca-certificates)
            fi

            # Clone on first run, pull on subsequent runs.
            if [ ! -d ~/personal-growth-desk/.git ]; then
              echo "--- first run: cloning repo ---"
              cd ~
              git clone https://github.com/wzp5700-code/better.git personal-growth-desk
              cd personal-growth-desk
            else
              echo "--- updating existing repo ---"
              cd ~/personal-growth-desk
              git fetch --depth=1 origin main
              git reset --hard origin/main
            fi

            echo "--- ensuring docker ---"
            if ! command -v docker >/dev/null 2>&1; then
              echo "--- installing docker ---"
              (apt-get install -y -qq docker.io docker-compose-v2) || (yum install -y -q docker docker-compose-plugin)
              systemctl enable --now docker
            fi
            if ! docker compose version >/dev/null 2>&1; then
              echo "docker compose not available after install — aborting"
              exit 1
            fi

            echo "--- syncing env ---"
            if [ ! -f .env ]; then
              # DOMAIN is optional — leave empty to access via raw IP over HTTP
              echo "DOMAIN=${{ secrets.VPS_DOMAIN }}" > .env
              if [ -n "${{ secrets.VPS_DOMAIN }}" ]; then
                echo "ALLOWED_ORIGINS=https://${{ secrets.VPS_DOMAIN }}" >> .env
              else
                echo "ALLOWED_ORIGINS=http://${{ secrets.VPS_HOST }}" >> .env
              fi
              echo "DATABASE_URL=./data/app.db" >> .env
              echo "PUSH_CHECK_INTERVAL_MS=60000" >> .env
            fi

            echo "--- pulling / building images ---"
            docker compose -f docker/docker-compose.yml pull caddy || true
            docker compose -f docker/docker-compose.yml build app
            docker compose -f docker/docker-compose.yml up -d

            # Wait for user-owned docker socket to be ready (after install)
            for i in $(seq 1 10); do
              if docker info >/dev/null 2>&1; then break; fi
              sleep 1
            done

            echo "--- waiting for health ---"
            for i in $(seq 1 30); do
              if [ -n "${{ secrets.VPS_DOMAIN }}" ]; then
                URL="https://${{ secrets.VPS_DOMAIN }}/api/health"
              else
                URL="http://${{ secrets.VPS_HOST }}/api/health"
              fi
              if curl -fsS "$URL" >/dev/null 2>&1; then
                echo "health OK after ${i}s ($URL)"
                exit 0
              fi
              sleep 1
            done
            echo "health check failed after 30s — check 'docker compose logs app'"
            exit 1